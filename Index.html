<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Identitäts-Quest: Wer sind wir?</title>
<style>
:root{--bg:#f6f3ee;--card:#fff;--ink:#1f2430;--mute:#5d6577;--acc:#6c4ee0;--acc2:#e8e1ff;--ok:#1f9d63;--okbg:#dcf5e7;--bad:#d2453b;--badbg:#fde4e1;--line:#d9d4ca;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1e222d;--ink:#eef0f6;--mute:#a2a9bb;--acc:#9d86ff;--acc2:#2b2748;--ok:#4cd391;--okbg:#17352a;--bad:#ff7a70;--badbg:#3d1f1d;--line:#343a4a}}
:root[data-theme="dark"]{--bg:#14161d;--card:#1e222d;--ink:#eef0f6;--mute:#a2a9bb;--acc:#9d86ff;--acc2:#2b2748;--ok:#4cd391;--okbg:#17352a;--bad:#ff7a70;--badbg:#3d1f1d;--line:#343a4a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
main{max-width:600px;margin:0 auto;padding:20px 16px 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
h1{font-size:1.9rem;line-height:1.15;margin:.2em 0}
h2{font-size:1.25rem;line-height:1.3;margin:.3em 0 .8em}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);font-weight:700;font-size:.78rem;padding:3px 10px;border-radius:99px;letter-spacing:.03em}
.mute{color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font-weight:700;font-size:.95rem}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:16px}
.prog i{display:block;height:100%;background:var(--acc);transition:width .3s}
button{font:inherit;cursor:pointer}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt:disabled{cursor:default}
.btn{background:var(--acc);color:#fff;border:0;border-radius:12px;padding:12px 22px;font-weight:700;margin-top:14px}
:root:not([data-theme="light"]) .btn{color:#14161d}
.btn.ghost{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-size:.95rem}
.fb.ok{background:var(--okbg)}.fb.bad{background:var(--badbg)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.chip{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:8px 14px}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
:root:not([data-theme="light"]) .chip.on{color:#14161d}
.map{display:block;margin:10px auto;max-width:100%}
.big{font-size:3rem;margin:0}
.badge{font-size:2.6rem}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pulse{50%{transform:scale(1.03)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bump{40%{transform:scale(1.25)}}
@keyframes tm{to{width:0}}
@keyframes up{to{transform:translateY(-70px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg)}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(245,179,1,.25)}}
.card,.bar,.prog{animation:in .35s ease both}
.opt{animation:in .4s ease both;transition:transform .15s,border-color .15s,background .25s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt.ok{animation:pulse .5s}.opt.bad{animation:shake .4s}
.btn{transition:transform .15s,opacity .2s}.btn:active{transform:scale(.96)}
.stats{display:flex;gap:8px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 12px;display:inline-block}
.pill.bump{animation:bump .4s}
.tm{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin:-6px 0 14px}
.tm i{display:block;height:100%;background:var(--acc);width:100%;animation:tm 15s linear forwards}.cw{position:relative;display:inline-block}.cheat{position:absolute;left:0;right:0;bottom:calc(100% + 2px);height:10px;border:0;padding:0;background:transparent;opacity:0;cursor:default}
.gam{display:block;width:100%;background:#f5b301;color:#1f2430;border:0;border-radius:12px;padding:11px;font-weight:800;margin-bottom:10px;animation:glow 1.6s infinite}
.pop{position:fixed;font-weight:800;pointer-events:none;animation:up 1s ease-out forwards;z-index:70;color:#d49a00;transform:translateX(-50%)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40;animation:fade .2s}
.wheel{position:relative;width:230px;height:230px;margin:18px auto 8px}
.wr{position:relative;width:100%;height:100%;border-radius:50%;border:4px solid var(--ink);background:conic-gradient(#f2b8b3 0 60deg,#bfe8d0 0 120deg,#f2b8b3 0 180deg,#f5c542 0 240deg,#f2b8b3 0 300deg,#bfe8d0 0 360deg);transition:transform 4s cubic-bezier(.15,.7,.1,1)}
.wr span{position:absolute;left:50%;top:50%;font-weight:800;font-size:.8rem;color:#1f2430;white-space:nowrap}
.pt{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:1.7rem;z-index:2;color:var(--ink)}
.cf{position:fixed;top:-14px;width:8px;height:12px;animation:fall 2s linear forwards;z-index:80;pointer-events:none}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main id="app"></main>
<script>
var Q=[
{t:"Facetten",q:"Wie lässt sich Identität am besten beschreiben?",o:["Mit einem einzigen passenden Begriff","Als Zusammenspiel vieler Facetten wie Werte, Interessen, Erfahrungen und Beziehungen","Nur über die Herkunft","Nur über die Religion"],a:1,e:"Wer wir sind, lässt sich nicht mit einem einzigen Begriff beschreiben. Verschiedene Einflüsse greifen ineinander."},
{t:"Wahr oder falsch?",q:"„Meine Identität bleibt mein ganzes Leben lang genau gleich.“",o:["Wahr","Falsch"],a:1,e:"Identität wandelt sich und wächst im Laufe des Lebens, durch neue Erfahrungen, Beziehungen und Einsichten."},
{t:"Zugehörigkeit",q:"Auf dem Sportplatz zählt Teamgeist, zu Hause die Familie, im Freundeskreis das gemeinsame Hobby. Was zeigt das?",o:["Man muss sich für eine Gruppe entscheiden","Wir gehören meist zu mehreren Gruppen, und welche Rolle zählt, wechselt mit der Situation","Gruppen haben mit Identität nichts zu tun","Nur Erwachsene gehören mehreren Gruppen an"],a:1,e:"Niemand gehört nur einer Gemeinschaft an. Mehrfachzugehörigkeiten sind die Normalität."},
{t:"Glaube & Sinnsuche",q:"Welche Aussage stimmt?",o:["Nur religiöse Menschen haben feste Werte","Religion gibt allen Menschen auf dieselbe Weise Halt","Auch ohne Religion können ethische Grundsätze und Gemeinschaft einen Lebensweg tragen","Innerhalb einer Religion glauben alle genau gleich"],a:2,e:"Für manche geben Rituale und Feiertage Halt, andere finden Orientierung in weltlichen Werten oder Philosophie. Und auch innerhalb einer Religion gibt es persönliche Zugänge."},
{t:"Perspektivenwechsel",q:"Eine neue Mitschülerin feiert Feiertage, die du nicht kennst. Du bist neugierig. Was ist am besten?",o:["Ich überlege mir selbst, wie das bei ihr wohl ist","Ich frage freundlich nach und höre aufmerksam zu","Ich google und erzähle der Klasse, was ich vermute","Ich sage nichts und halte Abstand"],a:1,e:"Nachfragen statt vermuten: Wie sieht die Person sich selbst? Aufmerksames Zuhören ermöglicht echte Begegnung."},
{t:"Fallbeispiel",q:"Im Unterricht fragt jemand einen Mitschüler: „Du bist doch Muslim, was sagt der Islam dazu?“ Warum ist das problematisch?",o:["Ist es nicht, er kennt sich ja bestimmt am besten aus","Einzelne werden ungefragt zur Vertretung einer ganzen Gruppe erklärt","Weil man nie über Religion reden darf","Weil die Frage zu leicht ist"],a:1,e:"Eine einzelne Person kann nicht für eine ganze Weltreligion oder Kultur sprechen. Das ist unfair und erschwert Zugehörigkeit."},
{t:"Etikett",q:"Was bedeutet der Satz „Eine Person ist mehr als ein Etikett“?",o:["Etiketten sind immer gemein gemeint","Religiöse oder kulturelle Merkmale beschreiben nie den ganzen Menschen","Man darf andere nie beschreiben","Jeder hat genau ein wichtiges Merkmal"],a:1,e:"Niemand möchte auf ein einziges Etikett reduziert werden, weder religiös noch weltanschaulich."},
{t:"Alltag: Grenzen",q:"Ein Freund will unbedingt wissen, woran du glaubst, aber du möchtest nicht darüber reden. Wie sollte die Klasse damit umgehen?",o:["Du musst antworten, sonst bist du unhöflich","Die Grenze wird akzeptiert: Niemand wird gedrängt, Überzeugungen offenzulegen","Man fragt so lange, bis es klappt","Man erzählt es dann den anderen weiter"],a:1,e:"Glaube oder Nichtglaube ist ein geschützter persönlicher Raum. Grenzen akzeptieren heißt: niemanden drängen."},
{t:"Alltag: Haltung",q:"Im Klassenchat taucht ein abwertender Spruch über eine Religion auf. Was zeigt Haltung?",o:["Nichts tun, ist ja nur ein Chat","Heimlich lachen","Eingreifen und gemeinsam mit anderen eine faire Lösung suchen","Selbst einen Spruch zurückschicken"],a:2,e:"Haltung zeigen heißt: bei abwertenden Sprüchen eingreifen und gemeinsam faire Lösungen finden."},
{t:"Alltag: Zuhören",q:"Jemand erzählt von einem Lebensentwurf, der ganz anders ist als deiner. Was bedeutet aktives Zuhören?",o:["Sofort sagen, ob ich es richtig finde","Unterschiedliche Lebensentwürfe wahrnehmen, ohne sie sofort zu bewerten","Gar nicht zuhören","Das Thema wechseln"],a:1,e:"Aktiv zuhören: wahrnehmen, ohne sofort zu bewerten. Respekt zeigt sich im Alltag, in der Pause, im Chat und im Gespräch."},
{t:"Zusammenhalt",q:"Was braucht echte Gemeinschaft laut dieser Einheit?",o:["Gleichmacherei, damit alle gleich sind","Raum für jede Person, und alle stehen füreinander ein","Eine Gruppe, die bestimmt, was normal ist","Möglichst wenig Kontakt"],a:1,e:"Echte Gemeinschaft verlangt keine Gleichmacherei: Jede Person braucht Raum, und alle stehen füreinander ein."}
];
var FAC=["Persönlichkeit","Werte","Interessen","Glaube / Weltanschauung","Beziehungen","Erfahrungen","Familie","Freunde","Schule & Sport","Kultur & Traditionen","Lebensziele","Stärken & Talente"];
var app=document.getElementById("app");
var st;
function $(i){return document.getElementById(i)}
function cs(){return st.inf?"∞":st.coins}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")}
function pop(t,el){var r=el.getBoundingClientRect(),s=document.createElement("span");s.className="pop";s.textContent=t;s.style.left=(r.left+r.width/2)+"px";s.style.top=r.top+"px";document.body.appendChild(s);setTimeout(function(){s.remove()},1000)}
function confetti(n){var c=["#6c4ee0","#f5b301","#1f9d63","#d2453b","#3b9ae1"];for(var i=0;i<n;i++){var d=document.createElement("i");d.className="cf";d.style.left=Math.random()*100+"vw";d.style.background=c[i%5];d.style.animationDelay=Math.random()*.5+"s";document.body.appendChild(d);setTimeout(function(x){x.remove()},2600,d)}}
function buzz(n){try{navigator.vibrate&&navigator.vibrate(n)}catch(e){}}
function start(){st={i:0,score:0,coins:0,streak:0,best:0,right:0,late:0,gam:null,done:false,order:shuf(Q.map(function(_,i){return i})),sel:[],t0:0};intro()}
function intro(){
app.innerHTML='<div class="card"><span class="tag">RELIGION · IDENTITÄT UND VIELFALT</span><h1>Identitäts-Quest</h1><p class="mute">Wer ich bin. Wer wir sind. Wie wir respektvoll zusammenleben.</p><p>Meistere '+Q.length+' Runden mit Fragen und Alltagssituationen. Für jede richtige Antwort bekommst du <b>3 🪙</b>. Antworte schnell (unter 6 Sekunden) für <b>+1 🪙</b> und halte eine Serie ab 3 für <b>+2 🪙</b>. Pro Frage hast du <b>15 Sekunden</b>: Läuft die Zeit ab, zählt die Frage als Fehler. Am Ende bekommst du eine Note.</p><p>🎰 <b>Ab 10 Coins</b> schaltest du das Glücksrad frei und darfst <b>einmal</b> dein Glück versuchen.</p><p class="mute" style="font-size:.9rem">Alles bleibt bei dir: Es wird nichts gespeichert, und niemand muss etwas über den eigenen Glauben verraten.</p><button class="btn" id="go">Los geht’s</button></div>';
$("go").onclick=round}
function gamBtn(){return(st.coins>=10&&!st.gam&&!st.live)?'<button class="gam" id="gam">🎰 Glücksrad freigeschaltet – einmal drehen!</button>':''}
function wireGam(){var g=$("gam");if(g)g.onclick=wheel;var c=$("ch");if(c)c.onclick=function(){st.inf=true;sync();pop("∞ 🪙",$("cn"));confetti(10)}}
function bar(label,pct){return '<div class="bar"><span>'+label+'</span><span class="stats"><span class="pill">⭐ <b id="sc">'+st.score+'</b></span><span class="cw"><button class="cheat" id="ch" tabindex="-1" aria-hidden="true"></button><span class="pill" id="cn">🪙 <b>'+cs()+'</b></span></span></span></div><div id="gs">'+gamBtn()+'</div><div class="prog"><i style="width:'+pct+'%"></i></div>'}
function sync(){if(st.inf)st.coins=9999;if(!$("sc"))return;$("sc").textContent=st.score;var c=$("cn");c.innerHTML='🪙 <b>'+cs()+'</b>';c.classList.remove("bump");void c.offsetWidth;c.classList.add("bump");$("gs").innerHTML=gamBtn();wireGam()}
function round(){
if(st.i>=Q.length){st.live=false;return bonus()}st.live=true;
var q=Q[st.order[st.i]],idx=q.o.length===2?[0,1]:shuf(q.o.map(function(_,i){return i}));
var h=bar('Runde '+(st.i+1)+' / '+Q.length,st.i/Q.length*100)+'<div class="card"><span class="tag">'+esc(q.t)+'</span><h2>'+esc(q.q)+'</h2><div class="tm"><i></i></div><div id="opts">';
idx.forEach(function(k,n){h+='<button class="opt" style="animation-delay:'+(.08*n+.1)+'s" data-k="'+k+'">'+esc(q.o[k])+'</button>'});
app.innerHTML=h+'</div><div id="fb"></div></div>';wireGam();st.t0=Date.now();clearTimeout(st.tid);
var bs=app.querySelectorAll(".opt");bs.forEach(function(b){b.onclick=function(){answer(q,+b.dataset.k,bs,b)}});st.tid=setTimeout(function(){timeout(q,bs)},15000)}
function answer(q,k,bs,btn){
clearTimeout(st.tid);st.live=false;var ok=k===q.a,sec=(Date.now()-st.t0)/1000,pts=0,co=0,info=[];
app.querySelector(".tm i").style.animationPlayState="paused";
bs.forEach(function(b){b.disabled=true;var bk=+b.dataset.k;if(bk===q.a)b.classList.add("ok");else if(bk===k)b.classList.add("bad")});
if(ok){st.streak++;st.right++;pts=10+(st.streak>1?(st.streak-1)*2:0);co=3;
if(sec<6){co++;info.push("Tempo +1")}
if(st.streak>=3){co+=2;info.push("Serie +2");confetti(14)}
st.score+=pts;st.coins+=co;if(st.streak>st.best)st.best=st.streak;pop("+"+co+" 🪙",btn);buzz(15)}
else{st.streak=0;buzz([30,40,30])}
var last=st.i+1>=Q.length;
$("fb").innerHTML='<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'Richtig! +'+pts+' Punkte, +'+co+' 🪙'+(info.length?' ('+info.join(', ')+')':''):'Nicht ganz. Die Serie startet neu.')+'</b><br>'+esc(q.e)+'</div><button class="btn" id="nx">'+(last?'Zur Identitätskarte':'Weiter')+'</button>';
$("nx").scrollIntoView({behavior:"smooth",block:"nearest"});
sync();$("nx").onclick=function(){st.i++;round()}}
function timeout(q,bs){
st.live=false;st.streak=0;st.late++;buzz([60,40,60]);
bs.forEach(function(b){b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("ok")});
var last=st.i+1>=Q.length;
$("fb").innerHTML='<div class="fb bad"><b>⏰ Zeit abgelaufen! Das zählt als Fehler.</b><br>Richtig wäre gewesen: '+esc(q.o[q.a])+'<br>'+esc(q.e)+'</div><button class="btn" id="nx">'+(last?'Zur Identitätskarte':'Weiter')+'</button>';
$("nx").scrollIntoView({behavior:"smooth",block:"nearest"});
sync();$("nx").onclick=function(){st.i++;round()}}
function wheel(){
var seg=[0,2,0,3,0,2],lab=["💀 Pleite","×2","💀 Pleite","×3","💀 Pleite","×2"],w=10,sp="";
lab.forEach(function(l,i){sp+='<span style="transform:translate(-50%,-50%) rotate('+(i*60+30)+'deg) translateY(-80px)">'+l+'</span>'});
var ov=document.createElement("div");ov.className="ov";
ov.innerHTML='<div class="card" style="max-width:360px;width:100%;text-align:center"><span class="tag">EINMALIG</span><h2 style="margin-bottom:.3em">🎰 Glücksrad</h2><p class="mute" style="margin:0">×2 oder ×3 vervielfacht deinen Einsatz, bei „Pleite“ ist er weg. Du hast <b>'+cs()+' 🪙</b>.</p><div class="chips" style="justify-content:center" id="wg"><button class="chip on" data-w="10">10 🪙</button>'+(st.coins>10?'<button class="chip" data-w="'+st.coins+'">Alles ('+cs()+')</button>':'')+'</div><div class="wheel"><div class="pt">▼</div><div class="wr" id="wr">'+sp+'</div></div><div id="wres" style="min-height:3em;font-weight:700"></div><div id="wb"><button class="btn" id="spin">Drehen</button> <button class="btn ghost" id="skip">Lieber nicht</button></div></div>';
document.body.appendChild(ov);
function close(){ov.remove();if(st.done)end();else sync()}
$("wg").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;w=+b.dataset.w;this.querySelectorAll(".chip").forEach(function(c){c.classList.toggle("on",c===b)})};
$("skip").onclick=close;
$("spin").onclick=function(){
var idx=Math.floor(Math.random()*6),R=2160-(idx*60+30)+Math.floor(Math.random()*36-18);
$("wb").innerHTML="";$("wg").style.pointerEvents="none";$("wg").style.opacity=.5;
st.gam={w:w};$("wr").style.transform="rotate("+R+"deg)";
setTimeout(function(){
var m=seg[idx];st.coins+=w*(m-1);st.gam.m=m;
if(m){$("wres").innerHTML="🎉 ×"+m+"! Du gewinnst "+w*(m-1)+" 🪙";confetti(40);buzz([20,30,20])}
else{$("wres").innerHTML="💥 Pleite! Du verlierst "+w+" 🪙";buzz(80)}
$("wb").innerHTML='<button class="btn" id="cl">Weiter</button>';$("cl").onclick=close},4300)}}
function bonus(){
var h=bar('Bonusrunde',100)+'<div class="card"><span class="tag">Selbstbild &amp; Facetten</span><h2>Deine Identitätskarte</h2><p class="mute">Tippe bis zu 6 Facetten an, die dir bei dir selbst gerade am wichtigsten sind. Ab 3 Facetten gibt es <b>+5 🪙</b>. Es gibt keine richtige Antwort, und nichts wird gespeichert.</p><div class="chips" id="chips">';
FAC.forEach(function(f,i){h+='<button class="chip" data-i="'+i+'">'+esc(f)+'</button>'});
app.innerHTML=h+'</div><svg id="map" class="map" viewBox="0 0 320 260" width="320" height="260" role="img" aria-label="Deine Identitätskarte"></svg><button class="btn" id="fin">Fertig</button></div>';
wireGam();drawMap();
$("chips").onclick=function(e){var b=e.target.closest(".chip");if(!b)return;var i=+b.dataset.i,p=st.sel.indexOf(i);
if(p>=0){st.sel.splice(p,1);b.classList.remove("on")}else if(st.sel.length<6){st.sel.push(i);b.classList.add("on")}else{b.style.animation="shake .4s";setTimeout(function(){b.style.animation=""},400)}
drawMap()};
$("fin").onclick=function(){if(st.sel.length>=3){st.coins+=5;pop("+5 🪙",$("fin"))}setTimeout(end,st.sel.length>=3?700:0)}}
function drawMap(){
var n=st.sel.length,h='<circle cx="160" cy="130" r="40" fill="var(--acc)"/><text x="160" y="135" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">ICH</text>';
if(!n)h+='<text x="160" y="225" text-anchor="middle" font-size="13" fill="var(--mute)">Wähle Facetten aus …</text>';
function pos(k){var a=(k/n)*Math.PI*2-Math.PI/2;return[160+Math.cos(a)*105,130+Math.sin(a)*85]}
st.sel.forEach(function(f,k){var p=pos(k);h+='<line x1="160" y1="130" x2="'+p[0]+'" y2="'+p[1]+'" stroke="var(--line)" stroke-width="2"/>'});
st.sel.forEach(function(f,k){var p=pos(k),w=Math.max(70,FAC[f].length*7+16);h+='<rect x="'+(p[0]-w/2)+'" y="'+(p[1]-15)+'" width="'+w+'" height="30" rx="15" fill="var(--acc2)" stroke="var(--acc)" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="12" font-weight="600" fill="var(--ink)">'+esc(FAC[f])+'</text>'});
$("map").innerHTML=h}
function end(){
